<div class="field">
    <label [for]="id" class="field__label">{{ label }}</label>
    <input
        [id]="id"
        [type]="type"
        [placeholder]="placeholder"
        [value]="value"
        [disabled]="isDisabled"
        class="field__input"
        [class.field__input--error]="hasError"
        (input)="handleInput($event)"
        (blur)="handleBlur()"
    />
    <ng-content></ng-content>
</div>
