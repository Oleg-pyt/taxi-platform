  <!-- Route path between pins -->
  <path d="M 640 330 Q 700 420 800 440 Q 920 460 1050 490 Q 1180 520 1280 500"
        stroke="#4a7fc1" stroke-width="4" fill="none" opacity="0.6" stroke-dasharray="10,6"/>

  <!-- Overall dark overlay for readability of the auth card -->
  <rect width="1920" height="1080" fill="#1a2540" opacity="0.45"/>
